databases:
  - name: navnext-db
    databaseName: navnext
    user: navnext_user
    plan: free

services:
  # Backend API Web Service
  - type: web
    name: navnext-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: navnext-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true

  # Frontend Static Site
  - type: web
    name: navnext-frontend
    env: static
    plan: free
    buildCommand: cd "Frontend/collage management system" && npm install && npm run build
    staticPublishPath: "Frontend/collage management system/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: navnext-backend
          property: host
